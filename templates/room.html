{% extends "index.html" %}
{% block main %}

<div class="room-wrapper">

  <!-- Chat header -->
  <div class="navbar-msg">
    <div class="navbar-left">
      <div class="room-name">{{ code }}</div>
      <div class="navbar-msg-info" id="conn-status">connecting…</div>
    </div>
    <div class="navbar-actions">
      <!-- Fullscreen toggle -->
      <button id="fullscreen-btn" title="Fullscreen">
        <!-- expand icon (default) -->
        <svg id="fs-expand" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 3 21 3 21 9"/><polyline points="9 21 3 21 3 15"/>
          <line x1="21" y1="3" x2="14" y2="10"/><line x1="3" y1="21" x2="10" y2="14"/>
        </svg>
        <!-- compress icon (fullscreen active) -->
        <svg id="fs-compress" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
             style="display:none">
          <polyline points="4 14 10 14 10 20"/><polyline points="20 10 14 10 14 4"/>
          <line x1="10" y1="14" x2="3" y2="21"/><line x1="21" y1="3" x2="14" y2="10"/>
        </svg>
      </button>
      <!-- Leave -->
      <button id="leave-btn" title="Leave room">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 5v14"/><path d="M21 12H7"/><path d="m15 18 6-6-6-6"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- Messages -->
  <div class="messages" id="messages"></div>

  <!-- Input bar -->
  <div class="inputs">
    <input id="message" type="text" placeholder="Type a message…" autocomplete="off">
    <button id="send-btn" title="Send">
      <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="white"
           width="20" height="20">
        <path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/>
      </svg>
    </button>
  </div>

</div>

<audio id="notifySound" src="{{ url_for('static', filename='sounds/notify.mp3') }}"></audio>

<script>
document.addEventListener("DOMContentLoaded", function () {

  const USERNAME      = "{{ username }}";
  const messagesDiv   = document.getElementById("messages");
  const msgInput      = document.getElementById("message");
  const sendBtn       = document.getElementById("send-btn");
  const leaveBtn      = document.getElementById("leave-btn");
  const status        = document.getElementById("conn-status");
  const roomWrapper   = document.querySelector(".room-wrapper");
  const fsBtn         = document.getElementById("fullscreen-btn");
  const fsExpand      = document.getElementById("fs-expand");
  const fsCompress    = document.getElementById("fs-compress");

  /* ── Socket ── */
  const socketio = io({ transports: ["websocket", "polling"] });

  socketio.on("connect", () => {
    status.textContent = "online";
    status.style.color = "";
    status.style.animation = "statusPulse 1.5s ease 3";
  });

  socketio.on("disconnect", () => {
    status.textContent = "reconnecting…";
    status.style.color = "#e53935";
    status.style.animation = "";
  });

  socketio.on("message", (data) => {
    createMessage(data.name, data.message, data.timestamp);
    if (data.name !== USERNAME) playSound();
  });

  /* ── UI helpers ── */
  function scrollToBottom() {
    messagesDiv.scrollTop = messagesDiv.scrollHeight;
  }

  function createMessage(name, msg, timestamp) {
    const isOwn = name === USERNAME;
    const div = document.createElement("div");
    div.className = isOwn ? "right-message-box" : "left-message-box";
    div.innerHTML =
      `<div class="username">${name}</div>` +
      `<div class="message">${msg}</div>` +
      `<div class="timestamp">${timestamp}</div>`;
    messagesDiv.appendChild(div);
    scrollToBottom();
  }

  function playSound() {
    const snd = document.getElementById("notifySound");
    snd.pause();
    snd.currentTime = 0;
    snd.play().catch(() => {});
  }

  function sendMessage() {
    const val = msgInput.value.trim();
    if (!val) return;
    socketio.emit("message", { data: val });
    msgInput.value = "";
    msgInput.focus();
  }

  /* ── Events ── */
  sendBtn.addEventListener("click", sendMessage);

  msgInput.addEventListener("keypress", (e) => {
    if (e.key === "Enter") { e.preventDefault(); sendMessage(); }
  });

  leaveBtn.addEventListener("click", () => {
    window.location.href = "/logout";
  });

  /* ── Fullscreen (room-wrapper only) ── */
  function updateFsIcon() {
    const isFs = !!document.fullscreenElement;
    fsExpand.style.display   = isFs ? "none"  : "block";
    fsCompress.style.display = isFs ? "block" : "none";
  }

  fsBtn.addEventListener("click", () => {
    if (!document.fullscreenElement) {
      roomWrapper.requestFullscreen().catch(() => {});
    } else {
      document.exitFullscreen().catch(() => {});
    }
  });

  document.addEventListener("fullscreenchange", updateFsIcon);

  /* ── Render history ── */
  {% for msg in messages %}
  createMessage("{{ msg.name }}", "{{ msg.message }}", "{{ msg.timestamp }}");
  {% endfor %}

});
</script>

{% endblock %}
