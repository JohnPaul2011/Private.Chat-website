<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Private.chat — Join</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
  <script>
    (function(){
      const saved=localStorage.getItem("theme");
      const sys=window.matchMedia("(prefers-color-scheme: dark)").matches;
      document.documentElement.setAttribute("data-theme", saved||(sys?"dark":"light"));
    })();
    window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change",(e)=>{
      if(!localStorage.getItem("theme")) document.documentElement.setAttribute("data-theme",e.matches?"dark":"light");
    });
    setTimeout(()=>{
      document.querySelectorAll(".flash-msg").forEach(m=>{m.classList.add("hide");setTimeout(()=>m.remove(),800);});
    },3000);
  </script>
</head>
<body>
  {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}{% for category, message in messages %}
  <div class="flash-msg flash-{{ category }}">{{ message }}</div>
  {% endfor %}{% endif %}{% endwith %}

  <div class="container">
    <h2>Join a Room</h2>
    <form method="POST" id="joinForm">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
      <input name="name" placeholder="Username" value="{{ username }}" required autocomplete="off">
      <input name="code" placeholder="Room ID" value="{{ code }}" required id="code-input">
      <input name="password" placeholder="Room password (if any)" id="pwField" autocomplete="off">
      <button type="submit">Join</button>
    </form>
    <p><a href="/create">Create a room instead →</a></p>
  </div>

  <script>
    // Pre-fill code from URL ?code= param (invite links)
    const urlCode = new URLSearchParams(location.search).get("code");
    if (urlCode) document.getElementById("code-input").value = urlCode;

    document.getElementById("joinForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const form = e.target;
      const pw = document.getElementById("pwField").value;
      sessionStorage.setItem("pending_secret", pw);
      const enc = new TextEncoder().encode(pw);
      const hash = await crypto.subtle.digest("SHA-256", enc);
      const hex = Array.from(new Uint8Array(hash)).map(b=>b.toString(16).padStart(2,"0")).join("");
      document.getElementById("pwField").value = hex;
      form.submit();
    });
  </script>
</body>
</html>
