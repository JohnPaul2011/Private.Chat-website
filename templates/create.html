<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Private.chat — Create</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}"/>
  <script>
    setTimeout(() => {
      document.querySelectorAll(".flash-msg").forEach(m => {
        m.classList.add("hide");
        setTimeout(() => m.remove(), 800);
      });
    }, 3000);
  </script>
</head>
<body>

  {% with messages = get_flashed_messages(with_categories=true) %}
  {% if messages %}
    {% for category, message in messages %}
    <div class="flash-msg flash-{{ category }}">{{ message }}</div>
    {% endfor %}
  {% endif %}
  {% endwith %}

  <div class="container">
    <h2>Create a Room</h2>
    <form method="POST">
      <input name="name" placeholder="Username" value="{{ username }}" required autocomplete="off">
      <input name="code" placeholder="Room ID (leave blank to auto-generate)" value="{{ code }}" autocomplete="off">
      <input name="password" placeholder="Room password (optional)" autocomplete="off">
      <button type="submit">Create</button>
    </form>
  </div>

</body>
</html>
